steps:
  - name: 'node:20-slim'
    entrypoint: npm
    args: ['install']
  - name: 'node:20-slim'
    entrypoint: npm
    args: ['run', 'build']
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/clubfasting-v2/app'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/clubfasting-v2/app'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'clubfasting-v2'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/clubfasting-v2/app'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-secrets=SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest'
images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/clubfasting-v2/app'
