steps:
  # Build Next.js standalone output natively (no Docker)
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    env:
      - 'NODE_ENV=production'
      - 'NEXT_PUBLIC_SUPABASE_URL=https://lyyevuyejxrjpsaisaal.supabase.co'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5eWV2dXllanhyanBzYWlzYWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4NjU5MDAsImV4cCI6MjA1NDQ0MTkwMH0.3dVhSi0RbShm4cxtXLoOfEDNsiGQk2Cr_CaXlkXHsqg'
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'NODE_ENV=production'
      - 'NEXT_PUBLIC_SUPABASE_URL=https://lyyevuyejxrjpsaisaal.supabase.co'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5eWV2dXllanhyanBzYWlzYWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4NjU5MDAsImV4cCI6MjA1NDQ0MTkwMH0.3dVhSi0RbShm4cxtXLoOfEDNsiGQk2Cr_CaXlkXHsqg'
      - 'NEXT_PUBLIC_SITE_URL=https://app.clubfasting.com'
      - 'NEXT_TELEMETRY_DISABLED=1'
  # Docker build (copies pre-built .next/standalone from previous step)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/clubfasting-v2/app:$COMMIT_SHA'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/clubfasting-v2/app:$COMMIT_SHA'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'clubfasting-v2'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/clubfasting-v2/app:$COMMIT_SHA'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/clubfasting-v2/app:$COMMIT_SHA'
options:
  machineType: 'E2_HIGHCPU_8'
