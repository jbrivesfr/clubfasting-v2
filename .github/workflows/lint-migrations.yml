name: Lint Migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Lint migrations
        run: supabase db lint
